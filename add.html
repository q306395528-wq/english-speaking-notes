<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>添加每日内容｜英语口语库</title><link rel="stylesheet" href="./styles.css"><style>.editor{width:min(1080px,calc(100% - 28px));margin:34px auto 70px}.editor-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.editor-head h1{margin:5px 0}.editor-head p,.hint{color:var(--muted)}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.editor-panel{padding:22px;border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.wide{grid-column:1/-1}.field label{font-size:12px;font-weight:850;color:var(--muted)}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;outline:0;color:var(--text);background:var(--soft)}.field textarea{min-height:76px;resize:vertical}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.draft{display:grid;gap:9px;margin-top:15px}.draft-item{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.draft-item strong,.draft-item small{display:block}.draft-item small{color:var(--muted)}.draft-item button{float:right;border:0;color:var(--red);background:transparent}.preview{width:100%;min-height:380px;padding:15px;border:0;border-radius:13px;color:#dbeafe;background:#111827;font:12px/1.6 ui-monospace,Consolas,monospace;resize:vertical}@media(max-width:760px){.editor-grid,.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.editor-head{flex-direction:column}}</style></head><body><main class="editor"><div class="editor-head"><div><span class="section-kicker">DAILY CONTENT EDITOR</span><h1>添加今天学到的句子</h1><p>先把聊天内容整理成草稿，再下载日期 JSON 和更新后的索引。</p></div><a class="button button-soft" href="./index.html">← 返回学习主页</a></div><div class="editor-grid"><section class="editor-panel"><div class="fields"><div class="field"><label>日期</label><input id="date" type="date"></div><div class="field"><label>当天主题</label><input id="title" value="今日英语口语练习"></div><div class="field wide"><label>当天总结</label><textarea id="summary" placeholder="今天主要练习了……"></textarea></div><div class="field wide"><label>正确英文 *</label><textarea id="english" placeholder="I'm on my way home."></textarea></div><div class="field wide"><label>中文意思 *</label><textarea id="chinese" placeholder="我正在回家的路上。"></textarea></div><div class="field wide"><label>我原来的错句</label><textarea id="original" placeholder="I on my way home."></textarea></div><div class="field wide"><label>错误原因</label><textarea id="reason" placeholder="句子缺少 be 动词 am。"></textarea></div><div class="field wide"><label>学习提示</label><textarea id="note" placeholder="也可以说 I'm heading home."></textarea></div><div class="field"><label>场景分类</label><input id="category" value="常用表达"></div><div class="field"><label>图标</label><input id="icon" value="💬"></div><div class="field"><label>难度</label><select id="level"><option>A1</option><option selected>A2</option><option>B1</option></select></div><div class="field"><label>内容类型</label><input id="type" value="语法纠错"></div><div class="field wide"><label>标签（逗号分隔）</label><input id="tags" placeholder="home, present continuous"></div></div><div class="row"><button class="button button-primary" id="add" type="button">加入当天草稿</button><button class="button button-soft" id="clear" type="button">清空表单</button></div><div class="draft" id="draft"></div></section><section class="editor-panel"><h2 style="margin-top:0">当天 JSON 预览</h2><p class="hint">下载后放到仓库的 <code>data/</code> 文件夹，并同时替换 <code>data/index.json</code>。</p><textarea class="preview" id="preview" readonly></textarea><div class="row"><button class="button button-primary" id="downloadDay" type="button">下载日期 JSON</button><button class="button button-soft" id="downloadIndex" type="button">下载 index.json</button><button class="button button-soft" id="copy" type="button">复制 JSON</button></div></section></div></main><script>(()=>{const $=s=>document.querySelector(s);let items=[];const localDate=()=>{let d=new Date;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};$("#date").value=localDate();const val=id=>$("#"+id).value.trim(),slug=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,"").trim().replace(/ +/g,"-").slice(0,50)||"lesson",pack=()=>({date:val("date"),title:val("title")||"今日英语口语练习",summary:val("summary"),lessons:items}),refresh=()=>{$("#preview").value=JSON.stringify(pack(),null,2);$("#draft").innerHTML=items.map((x,i)=>`<div class="draft-item"><button data-remove="${i}">删除</button><strong>${x.english}</strong><small>${x.chinese}</small></div>`).join("")},download=(name,data)=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download=name;a.click();URL.revokeObjectURL(a.href)};$("#add").onclick=()=>{if(!val("english")||!val("chinese"))return alert("请填写正确英文和中文意思");let date=val("date"),id=`${date}-${slug(val("english"))}`;if(items.some(x=>x.id===id))id+=`-${items.length+1}`;items.push({id,category:val("category")||"常用表达",icon:val("icon")||"💬",level:val("level")||"A2",type:val("type")||"日常表达",english:val("english"),chinese:val("chinese"),original:val("original"),reason:val("reason"),note:val("note"),tags:val("tags").split(/[,，]/).map(x=>x.trim()).filter(Boolean)});["english","chinese","original","reason","note","tags"].forEach(id=>$("#"+id).value="");refresh()};$("#clear").onclick=()=>["english","chinese","original","reason","note","tags"].forEach(id=>$("#"+id).value="");$("#draft").onclick=e=>{let b=e.target.closest("[data-remove]");if(b){items.splice(+b.dataset.remove,1);refresh()}};$("#downloadDay").onclick=()=>items.length?download(`${val("date")}.json`,pack()):alert("请先加入至少一句");$("#downloadIndex").onclick=async()=>{if(!items.length)return alert("请先加入至少一句");let idx={version:2,updatedAt:val("date"),days:[]};try{idx=await fetch("./data/index.json").then(r=>r.json())}catch{}idx.updatedAt=val("date");idx.days=(idx.days||[]).filter(x=>x.date!==val("date"));idx.days.unshift({date:val("date"),file:`${val("date")}.json`,title:val("title")||"今日英语口语练习"});idx.days.sort((a,b)=>b.date.localeCompare(a.date));download("index.json",idx)};$("#copy").onclick=async()=>{await navigator.clipboard.writeText($("#preview").value);$("#copy").textContent="已复制 ✓";setTimeout(()=>$("#copy").textContent="复制 JSON",1200)};["date","title","summary"].forEach(id=>$("#"+id).oninput=refresh);refresh()})()</script></body></html>
